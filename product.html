<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ABBY MART</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <div class="logo">
        ABBY MART
    </div>

    <a href="index.html" class="back-home">
        ← Back to Shop
    </a>

</header>

<section class="product-details">

    <div class="product-image">

        <img
        src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=700"
        alt="Product">

    </div>

    <div class="product-content">

        <h1>Premium Skincare Kit</h1>

        <div class="product-rating">
            ★★★★★
        </div>

        <h2>GH₵120</h2>

        <p class="product-description">

            The Premium Skincare Kit contains high-quality
            skincare essentials designed to hydrate,
            nourish and protect your skin.

            Suitable for all skin types and perfect for
            everyday use.

        </p>

        <div class="quantity-box">

            <button onclick="decreaseQuantity()">
                -
            </button>

            <span id="quantity">
                1
            </span>

            <button onclick="increaseQuantity()">
                +
            </button>

        </div>

        <div class="product-buttons">

           <button
onclick="addToCart(
'Premium Skincare Kit',
120,
quantity
)">
    Add To Cart
</button>


            <button class="wishlist-btn">

                ❤ Wishlist

            </button>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
